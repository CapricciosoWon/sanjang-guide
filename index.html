<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>산장관광지 여행 가이드</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      background: #111827;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }
    body { overflow-x: hidden; }
    .app {
      min-height: 100vh;
      background: linear-gradient(180deg, #0f172a 0%, #111827 100%);
    }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 10px 14px 8px;
      text-align: center;
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid rgba(255,255,255,.08);
      backdrop-filter: blur(8px);
    }
    .title {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      line-height: 1.2;
    }
    .subtitle {
      margin-top: 4px;
      font-size: 12px;
      color: #cbd5e1;
    }
    .viewer {
      position: relative;
      width: 100%;
      overflow: hidden;
    }
    .slides {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .slides::-webkit-scrollbar { display: none; }
    .slide {
      min-width: 100%;
      scroll-snap-align: start;
      padding: 10px 10px 18px;
    }
    .page-stack {
      display: grid;
      gap: 10px;
      max-width: 760px;
      margin: 0 auto;
    }
    .page-stack img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,.24);
      background: #d6eefb;
    }
    .slide-label {
      text-align: center;
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 8px;
    }
    .nav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 999px;
      background: rgba(17,24,39,.72);
      color: #fff;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 30;
      cursor: pointer;
      backdrop-filter: blur(6px);
      box-shadow: 0 6px 18px rgba(0,0,0,.24);
    }
    .prev { left: 8px; }
    .next { right: 8px; }

    .bottombar {
      position: sticky;
      bottom: 0;
      z-index: 20;
      padding: 8px 14px 10px;
      background: rgba(15, 23, 42, 0.95);
      border-top: 1px solid rgba(255,255,255,.08);
      backdrop-filter: blur(8px);
    }
    .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .counter {
      font-size: 14px;
      font-weight: 700;
    }
    .hint {
      font-size: 12px;
      color: #cbd5e1;
    }
    .dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 6px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: rgba(255,255,255,.25);
      transition: .2s ease;
      cursor: pointer;
    }
    .dot.active {
      width: 22px;
      background: #60a5fa;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1 class="title">산장관광지 여행 가이드</h1>
      <div class="subtitle">2장씩 보고, 좌우로 넘겨보세요</div>
    </header>

    <main class="viewer">
      <button class="nav prev" type="button" aria-label="이전 슬라이드">‹</button>

      <div class="slides" id="slides">
        <section class="slide">
          <div class="slide-label">산장관광지 소개 · 대표 관광명소</div>
          <div class="page-stack">
            <img src="page1.jpg" alt="산장관광지 여행 안내 1페이지">
            <img src="page2.jpg" alt="산장관광지 여행 안내 2페이지">
          </div>
        </section>

        <section class="slide">
          <div class="slide-label">맛집 리스트 · 여행 루틴</div>
          <div class="page-stack">
            <img src="page3.jpg" alt="산장관광지 여행 안내 3페이지">
            <img src="page4.jpg" alt="산장관광지 여행 안내 4페이지">
          </div>
        </section>
      </div>

      <button class="nav next" type="button" aria-label="다음 슬라이드">›</button>
    </main>

    <footer class="bottombar">
      <div class="meta">
        <div class="counter"><span id="current">1</span> / 2</div>
        <div class="hint">위아래로 확인 · 좌우 슬라이드</div>
      </div>
      <div class="dots">
        <span class="dot active"></span>
        <span class="dot"></span>
      </div>
    </footer>
  </div>

  <script>
    const slides = document.getElementById('slides');
    const dots = Array.from(document.querySelectorAll('.dot'));
    const current = document.getElementById('current');
    const prev = document.querySelector('.prev');
    const next = document.querySelector('.next');
    const total = 2;

    function indexNow() {
      return Math.round(slides.scrollLeft / slides.clientWidth);
    }
    function refresh() {
      const i = indexNow();
      current.textContent = i + 1;
      dots.forEach((d, n) => d.classList.toggle('active', n === i));
      prev.style.opacity = i === 0 ? '.35' : '1';
      next.style.opacity = i === total - 1 ? '.35' : '1';
    }
    function go(i) {
      i = Math.max(0, Math.min(total - 1, i));
      slides.scrollTo({ left: slides.clientWidth * i, behavior: 'smooth' });
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    prev.addEventListener('click', () => go(indexNow() - 1));
    next.addEventListener('click', () => go(indexNow() + 1));
    dots.forEach((d, i) => d.addEventListener('click', () => go(i)));

    let t;
    slides.addEventListener('scroll', () => {
      clearTimeout(t);
      t = setTimeout(refresh, 70);
    });
    window.addEventListener('resize', refresh);
    refresh();
  </script>
</body>
</html>
